name: Provision Server

on:
  workflow_dispatch:

jobs:
  provision:
    runs-on: self-hosted

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Diagnosticar permissões
        run: |
          echo "======================================"
          echo " USUÁRIO"
          echo "======================================"
          whoami
          id

          echo
          echo "======================================"
          echo " SUDO"
          echo "======================================"
          sudo -n -l || true

          echo
          echo "======================================"
          echo " ARQUIVOS SUDOERS"
          echo "======================================"
          ls -la /etc/sudoers.d/ || true

          echo
          echo "======================================"
          echo " TESTE SUDO"
          echo "======================================"
          sudo -n true
